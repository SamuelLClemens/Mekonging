<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Content Security Policy: execution and connections are locked to this origin.
       The app is fully self-hosted and offline-first. The optional live-translate
       feature (js/translate.js) calls a user-configured endpoint; enabling it
       requires adding that origin to connect-src below (documented in Settings). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self'; media-src 'self' blob: https://translate.google.com https://static.inaturalist.org https://inaturalist-open-data.s3.amazonaws.com; worker-src 'self' blob:; connect-src 'self' https://server.arcgisonline.com https://open.er-api.com https://api.open-meteo.com https://marine-api.open-meteo.com https://air-quality-api.open-meteo.com https://api.mymemory.translated.net https://api.inaturalist.org; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <!-- interactive-widget=resizes-content: when the on-screen keyboard opens, the LAYOUT
       viewport shrinks (rather than only the visual viewport), so the fixed bottom nav
       stays pinned to the bottom of the usable area instead of jumping over the keyboard. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Mekonging — travel Thailand, Vietnam, Cambodia & Laos like an expert</title>
  <meta name="description" content="Mekonging is a free, private, offline-first travel companion for Thailand, Vietnam, Cambodia, and Laos: phrasebook, fair prices, places, transport, history, and best-of recommendations. No accounts, no tracking.">
  <meta name="theme-color" content="#E8632A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mekonging">
  <link rel="stylesheet" href="css/style.css">

  <!-- Module preload graph. The app is native ES modules with no bundler, so without these the
       browser cannot discover a single dependency until it has downloaded AND parsed main.js —
       making first paint a two-round-trip chain: html, then main.js in full, then everything
       else. These hints let all eager modules download in parallel with main.js instead of
       after it. Every entry is a module the app statically imports, so nothing here is
       speculative; lazily-imported country data and screens are deliberately absent.
       Regenerate with: python3 scripts/check-preloads.py --fix -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/screens/places.js">
  <link rel="modulepreload" href="js/data/medical.js">
  <link rel="modulepreload" href="js/screens/phrasebook.js">
  <link rel="modulepreload" href="js/data/photos.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/data/history.js">
  <link rel="modulepreload" href="js/screens/budget.js">
  <link rel="modulepreload" href="js/screens/weather.js">
  <link rel="modulepreload" href="js/render-utils.js">
  <link rel="modulepreload" href="js/screens/home.js">
  <link rel="modulepreload" href="js/data/checklist.js">
  <link rel="modulepreload" href="js/screens/medical.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/data/allergens.js">
  <link rel="modulepreload" href="js/data/regions.info.js">
  <link rel="modulepreload" href="js/vault.js">
  <link rel="modulepreload" href="js/data/phrasebook.km.js">
  <link rel="modulepreload" href="js/personal.js">
  <link rel="modulepreload" href="js/data/phrasebook.th.js">
  <link rel="modulepreload" href="js/data/phrasebook.lo.js">
  <link rel="modulepreload" href="js/data/phrasebook.my.js">
  <link rel="modulepreload" href="js/data/geo.js">
  <link rel="modulepreload" href="js/ui-widgets.js">
  <link rel="modulepreload" href="js/data/phrasebook.vi.js">
  <link rel="modulepreload" href="js/weather.js">
  <link rel="modulepreload" href="js/data/regions.js">
  <link rel="modulepreload" href="js/data/phrasebook.zh.js">
  <link rel="modulepreload" href="js/data/phrasebook.ms.js">
  <link rel="modulepreload" href="js/data/diet.js">
  <link rel="modulepreload" href="js/data/phrasebook.hmn.js">
  <link rel="modulepreload" href="js/exporter.js">
  <link rel="modulepreload" href="js/data/hospitals.js">
  <link rel="modulepreload" href="js/social.js">
  <link rel="modulepreload" href="js/data/essentials.js">
  <link rel="modulepreload" href="js/lazy-data.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/reminders.js">
  <link rel="modulepreload" href="js/visits.js">
  <link rel="modulepreload" href="js/gamify.js">
  <link rel="modulepreload" href="js/tts.js">
  <link rel="modulepreload" href="js/journey.js">
  <link rel="modulepreload" href="js/translate.js">
  <link rel="modulepreload" href="js/idb.js">
  <link rel="modulepreload" href="js/data/ui-strings.js">
  <link rel="modulepreload" href="js/currency.js">
  <link rel="modulepreload" href="js/app-state.js">
  <link rel="modulepreload" href="js/data/drivetimes.js">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <!-- Persistent screen-reader announcer for single-page route changes. It lives OUTSIDE
       #app so it survives the innerHTML reset that mount() performs on every navigation. -->
  <div id="route-announce" class="sr-only" aria-live="polite" role="status"></div>
  <div id="app" role="main" tabindex="-1">
    <main class="splash">
      <svg class="splash-logo-svg" viewBox="0 0 360 122" role="img" aria-label="Mekonging" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mkg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F2A93B"/><stop offset="0.5" stop-color="#E8632A"/><stop offset="1" stop-color="#D6336C"/>
          </linearGradient>
        </defs>
        <g transform="translate(150 6)">
          <circle cx="30" cy="30" r="18" fill="url(#mkg)"/>
          <g stroke="#F2A93B" stroke-width="3" stroke-linecap="round">
            <line x1="30" y1="2" x2="30" y2="9"/><line x1="30" y1="51" x2="30" y2="58"/>
            <line x1="2" y1="30" x2="9" y2="30"/><line x1="51" y1="30" x2="58" y2="30"/>
            <line x1="10" y1="10" x2="15" y2="15"/><line x1="45" y1="45" x2="50" y2="50"/>
            <line x1="50" y1="10" x2="45" y2="15"/><line x1="15" y1="45" x2="10" y2="50"/>
          </g>
        </g>
        <text x="180" y="94" text-anchor="middle" font-family="'Avenir Next','Trebuchet MS',system-ui,sans-serif" font-weight="800" font-size="40" fill="url(#mkg)" letter-spacing="0.5">Mekonging</text>
        <path d="M40 110 q40 -12 80 0 t80 0 t80 0 t40 0" fill="none" stroke="#16A39A" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <p class="splash-sub">Loading your companion…</p>
    </main>
  </div>
  <noscript>
    <!-- No-JavaScript fallback. Mekonging is a client-rendered PWA (it has no server to
         render pages), so the full app needs JavaScript. But a traveller who lands here
         with JS off — or a bundle that failed on weak signal — must still get the one thing
         that cannot wait: emergency numbers. These are the same verified numbers the app
         carries offline (js/data/info.*.js). tel: links dial directly. -->
    <div style="max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem;font-family:'Avenir Next','Trebuchet MS',system-ui,sans-serif;color:#3A2415;line-height:1.5">
      <h1 style="color:#E8632A;font-size:1.6rem;margin:.25rem 0">Mekonging</h1>
      <p style="margin:.25rem 0 1rem">Your offline travel companion for Thailand, Vietnam, Cambodia and Laos. The full guide needs JavaScript enabled — turn it on and reload, and it then works offline. Meanwhile, the emergency numbers you might need right now:</p>
      <div style="border:2px solid #E8632A;border-radius:12px;padding:.75rem 1rem;margin-bottom:1rem">
        <h2 style="font-size:1.05rem;margin:.25rem 0">🇹🇭 Thailand</h2>
        <p style="margin:.15rem 0">Tourist Police (English): <a href="tel:1155" style="color:#16847C;font-weight:700">1155</a> · Police: <a href="tel:191" style="color:#16847C;font-weight:700">191</a> · Ambulance: <a href="tel:1669" style="color:#16847C;font-weight:700">1669</a></p>
        <h2 style="font-size:1.05rem;margin:.6rem 0 .25rem">🇻🇳 Vietnam</h2>
        <p style="margin:.15rem 0">Police: <a href="tel:113" style="color:#16847C;font-weight:700">113</a> · Ambulance: <a href="tel:115" style="color:#16847C;font-weight:700">115</a> · Fire: <a href="tel:114" style="color:#16847C;font-weight:700">114</a></p>
        <h2 style="font-size:1.05rem;margin:.6rem 0 .25rem">🇰🇭 Cambodia</h2>
        <p style="margin:.15rem 0">Police: <a href="tel:117" style="color:#16847C;font-weight:700">117</a> · Ambulance: <a href="tel:119" style="color:#16847C;font-weight:700">119</a> · Fire: <a href="tel:118" style="color:#16847C;font-weight:700">118</a></p>
        <h2 style="font-size:1.05rem;margin:.6rem 0 .25rem">🇱🇦 Laos</h2>
        <p style="margin:.15rem 0">Police: <a href="tel:1191" style="color:#16847C;font-weight:700">1191</a> · Ambulance: <a href="tel:1195" style="color:#16847C;font-weight:700">1195</a> · Fire: <a href="tel:1190" style="color:#16847C;font-weight:700">1190</a></p>
      </div>
      <p style="font-size:.9rem;color:#7A5A3C;margin:.25rem 0">To enable JavaScript: open your browser menu → Settings → Site settings → JavaScript → Allow, then reload. Once loaded, Mekonging keeps working with no signal.</p>
    </div>
  </noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
